name: Update walking robot
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_robot.py'
      - '.github/workflows/robot.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/generate_robot.py
      - name: Commit generated GIF
        run: |
          mkdir -p assets
          mv scripts/robot.gif assets/robot.gif
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/robot.gif
          if ! git diff --cached --quiet; then
            git commit -m 'Update walking robot animation'
            git push
          fi
